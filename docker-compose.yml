version: "3.8"

services:
  database:
    image: postgres:15-alpine
    container_name: healthtracker_database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: health-tracker-db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthtracker_api
    restart: always
    ports:
      - "3108:3108"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: health-tracker-db
    depends_on:
      - database

volumes:
  pgdata_volume:
