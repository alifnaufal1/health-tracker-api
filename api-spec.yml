openapi: "3.0.3"
info:
  title: Health Tracker RESTful API
  description: "API Spec for Health Tracker RESTful API"
  version: "1.0"
servers:
  - url: https://localhost:3108/api
paths:
  /auth/signup:
    post:
      tags:
        - "Auth API"
      description: "Sign up user"
      summary: "Sign up user"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateOrUpdate"
      responses:
        "200":
          description: "Success sign up"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
  /auth/signin:
    post:
      tags:
        - "Auth API"
      description: "Sign In user"
      summary: "Sign In user"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSignIn"
      responses:
        "200":
          description: "Success sign in"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/SignInRequest"
  /auth/signout:
    post:
      security:
        - JWTAuth: []
      tags:
        - "Auth API"
      description: "Sign Out user"
      summary: "Sign Out user"
      responses:
        "200":
          description: "Success sign out"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  status:
                    type: string
  /users/me:
    get:
      security:
        - JWTAuth: []
      tags:
        - "User API"
      description: "Get Signed in User"
      summary: "Get Signed in User"
      responses:
        "200":
          description: "Success get user"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: "number"
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
    put:
      security:
        - JWTAuth: []
      tags:
        - "User API"
      description: "Get Signed in User"
      summary: "Get Signed in User"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateOrUpdate"
      responses:
        "200":
          description: "Success create User"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: "number"
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
  /workouts:
    get:
      security:
        - JWTAuth: []
      tags:
        - Workouts API
      parameters:
        - name: device
          in: query
          description: Filter workouts based on device used
          required: false
          schema:
            type: string
      description: "Get all workout data"
      summary: "Get all workout data"
      responses:
        "200":
          description: "Success get all workout data"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/WorkoutList"
    post:
      security:
        - JWTAuth: []
      tags:
        - Workouts API
      description: "Create new workout data"
      summary: "Create new workout data"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutCreateOrUpdate"
      responses:
        "200":
          description: "Success create workout"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: "number"
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/WorkoutDetail"
  /workouts/{WorkoutId}:
    get:
      security:
        - JWTAuth: []
      tags:
        - Workouts API
      description: "Get workout data by id"
      summary: "Get workout data by id"
      parameters:
        - name: "WorkoutId"
          in: "path"
          description: "Workout Data Id"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Success get workout data"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: "number"
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/WorkoutDetail"

components:
  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        user_id:
          type: string
        username:
          type: string
        name:
          type: string
    UserCreateOrUpdate:
      type: object
      properties:
        username:
          type: string
        name:
          type: string
        password:
          type: string
    UserSignIn:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    SignInRequest:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/Tokens"
    Device:
      type: object
      properties:
        device_id:
          type: string
        device_name:
          type: string
        manufacturer_name:
          type: string
        local_name:
          type: string
        user_id:
          type: string
    DeviceCreateOrUpdate:
      type: object
      properties:
        device_id:
          type: string
        device_name:
          type: string
        manufacturer_name:
          type: string
        local_name:
          type: string
    WorkoutList:
      type: object
      properties:
        workout_data_id:
          type: string
        workout_data_type:
          type: string
        total_steps:
          type: number
        total_distance:
          type: number
        total_calories:
          type: number
        avg_heart_rate:
          type: number
        avg_pace:
          type: number
        duration:
          type: number
        started_at:
          type: string
        device_name:
          type: string
    WorkoutDetail:
      type: object
      properties:
        workout_data_id:
          type: string
        workout_data_type:
          type: string
        total_steps:
          type: number
        total_distance:
          type: number
        total_calories:
          type: number
        avg_heart_rate:
          type: number
        max_heart_rate:
          type: number
        avg_pace:
          type: number
        best_pace:
          type: number
        duration:
          type: number
        splits:
          type: array
          items:
            $ref: "#/components/schemas/PaceSplit"
        heart_rate_series:
          type: array
          items:
            $ref: "#/components/schemas/HeartRatePoint"
        started_at:
          type: string
        ended_at:
          type: string
        device_id:
          type: string
    WorkoutBatchData:
      type: object
      properties:
        steps:
          type: number
        distance:
          type: number
        calories:
          type: number
        heart_rate:
          type: number
        pace:
          type: number
        timestamp:
          type: string
    HeartRatePoint:
      type: object
      properties:
        bpm:
          type: number
        timestamp:
          type: string
    PaceSplit:
      type: object
      properties:
        pace:
          type: number
        avg_heart_rate:
          type: string
        type:
          type: string
    WorkoutCreateOrUpdate:
      type: object
      properties:
        workout_data_type:
          type: string
        workout_batch_data:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutBatchData"
